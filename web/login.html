<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Avaliação Física</title>
<style>
  :root { --bg: #f4f6f8; --painel: #fff; --texto: #1c2430; --suave: #5d6b7a; --borda: #dfe4ea; --pri: #0f766e; --perigo: #b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1419; --painel: #172029; --texto: #e5ebf0; --suave: #93a1b0; --borda: #2a3644; --pri: #2dd4bf; --perigo: #f87171; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--texto);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  form { width: min(360px, 100%); background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; padding: 26px 22px; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 20px; } p { margin: 0; color: var(--suave); font-size: 13px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--suave); }
  input { font: inherit; color: inherit; background: var(--painel); padding: 10px; border: 1px solid var(--borda); border-radius: 8px; }
  input:focus { outline: 2px solid var(--pri); outline-offset: -1px; }
  button { font: inherit; font-weight: 600; padding: 11px; border: 0; border-radius: 8px; background: var(--pri); color: #fff; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { color: #062420; } }
  button:disabled { opacity: .6; }
  #erro { color: var(--perigo); font-size: 13px; min-height: 1.2em; }
</style>
</head>
<body>
<form id="f">
  <h1>Avaliação Física</h1>
  <p>Área restrita: dados de saúde dos alunos.</p>
  <label>Usuário<input name="usuario" autocomplete="username" required autofocus></label>
  <label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
  <div id="erro" role="alert"></div>
  <button id="b">Entrar</button>
</form>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const b = document.getElementById('b'), erro = document.getElementById('erro');
  b.disabled = true; erro.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.fromEntries(new FormData(e.target))) });
    if (r.ok) { location.href = '/'; return; }
    erro.textContent = (await r.json().catch(() => ({}))).erro || 'Não foi possível entrar.';
  } catch { erro.textContent = 'Sem conexão com o servidor.'; }
  b.disabled = false;
};
</script>
</body>
</html>
